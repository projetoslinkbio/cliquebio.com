<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clique Bio</title>
<style>
  :root{
    --bg: #0a0a12;
    --bg-2: #0d0e1a;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --text: #f2f2f7;
    --text-dim: #9797a8;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  @media (prefers-reduced-motion: reduce){
    * { animation: none !important; transition: none !important; }
  }

  html, body{
    height:100%;
    background: var(--bg);
    overscroll-behavior: none;
  }

  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    min-height: 100dvh;
    display:flex;
    justify-content:center;
    position: relative;
    overflow-x: hidden;
  }

  /* fundo com efeito de glow orbitando devagar */
  .glow{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--bg);
  }
  .glow::before, .glow::after{
    content:"";
    position:absolute;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .glow::before{
    background: radial-gradient(circle, var(--violet), transparent 60%);
    top: -25vmax;
    left: -20vmax;
  }
  .glow::after{
    background: radial-gradient(circle, var(--cyan), transparent 60%);
    bottom: -25vmax;
    right: -20vmax;
    animation-delay: -11s;
  }
  @keyframes drift{
    from{ transform: translate(0,0) scale(1); }
    to{ transform: translate(6vmax, 4vmax) scale(1.08); }
  }

  .noise{
    position: fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  main{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    padding: 48px 24px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .mark{
    width: 72px;
    height: 72px;
    border-radius: 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    color: #08080d;
    box-shadow: 0 0 40px -8px rgba(139,92,246,0.55);
    margin-bottom: 20px;
  }

  .name{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
  }

  .role{
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 4px;
    margin-bottom: 36px;
  }

  h1{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.22;
    letter-spacing: -0.015em;
    max-width: 21ch;
  }

  .sub{
    color: var(--text-dim);
    font-size: 15.5px;
    line-height: 1.55;
    max-width: 34ch;
    margin-top: 16px;
    margin-bottom: 34px;
  }

  .cta{
    width: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    padding: 17px 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    color: #08080d;
    font-weight: 600;
    font-size: 16.5px;
    text-decoration:none;
    box-shadow: 0 8px 30px -6px rgba(34,211,238,0.35), 0 0 0 1px rgba(255,255,255,0.06) inset;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:active{
    transform: scale(0.97);
  }
  .cta:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
  }

  .cta svg{ width: 20px; height: 20px; flex-shrink:0; }

  .links{
    margin-top: 14px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .link-sec{
    width:100%;
    padding: 14px 20px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 500;
    text-decoration:none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .link-sec:hover{
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.14);
  }
  .link-sec:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  footer{
    position: relative;
    z-index: 2;
    margin-top: auto;
    padding: 24px 0 20px;
    font-size: 12.5px;
    color: rgba(151,151,168,0.6);
  }

  footer span{
    color: var(--text-dim);
    font-weight: 500;
  }
</style>
</head>
<body>

  <div class="glow"></div>
  <div class="noise"></div>

  <main>
    <div class="mark">CB</div>
    <div class="name">Clique Bio</div>
    <div class="role">Páginas de link na bio sob medida</div>

    <h1>Sua bio ainda não vende por você</h1>
    <p class="sub">Transformamos o link do seu Instagram numa página feita pra converter curioso em cliente — pronta em poucos dias, com a cara do seu negócio.</p>

    <a class="cta" href="https://wa.me/5500000000000?text=Oi!%20Quero%20saber%20mais%20sobre%20a%20Clique%20Bio" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.01 2c-5.52 0-10 4.48-10 10 0 1.77.46 3.43 1.27 4.87L2 22l5.28-1.38A9.94 9.94 0 0 0 12.01 22c5.52 0 10-4.48 10-10s-4.48-10-10-10zm5.84 14.24c-.25.7-1.45 1.35-2 1.44-.51.08-1.15.11-1.86-.12-.43-.14-.98-.32-1.68-.63-2.96-1.28-4.89-4.25-5.04-4.45-.15-.2-1.2-1.6-1.2-3.05 0-1.45.76-2.16 1.03-2.46.27-.3.6-.37.8-.37.2 0 .4 0 .57.01.18.01.43-.07.67.51.25.6.85 2.07.92 2.22.07.15.12.33.02.53-.1.2-.15.32-.3.49-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.3.76 1.25 1.63 2.02 1.12.99 2.06 1.3 2.36 1.45.3.15.48.13.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.73.82 2.03.97.3.15.5.22.57.35.08.13.08.72-.17 1.42z"/></svg>
      Falar no WhatsApp agora
    </a>

    <div class="links">
      <a class="link-sec" href="https://instagram.com/" target="_blank" rel="noopener">Ver portfólio no Instagram</a>
    </div>
  </main>

  <footer>Feito por <span>Clique Bio</span></footer>

</body>
</html>
